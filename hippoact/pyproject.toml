[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hippoact"
version = "0.1.0"
description = "Hippocampus-inspired object-centric representations for visuomotor robot learning"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24",
    "einops>=0.7.0",
    "omegaconf>=2.3.0",
    "hydra-core>=1.3.0",
    "tqdm>=4.65",
    "wandb>=0.16.0",
    "matplotlib>=3.7",
    "pillow>=10.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "ruff>=0.1.0",
    "ipython",
]
dmc = [
    "dm-control>=1.0.14",
    "gymnasium>=0.29",
]

[tool.setuptools.packages.find]
include = ["hippoact*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
