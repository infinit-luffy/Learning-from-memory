env:
  env_id: AlienNoFrameskip-v4
  n_envs: 1
  n_stack: 4
  seed: 0
  terminal_on_life_loss: false
model:
  static_dim: 64
  dynamic_dim: 64
  assoc_dim: 128
  hidden_channels: 32
  features_dim: 256
ppo:
  learning_rate: 0.00025
  n_steps: 128
  batch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.1
training:
  total_timesteps: 10000
  save_path: runs/alien/sdam_alternating_ppo
pretraining:
  collect_steps: 50000
  train_steps: 1000
  batch_size: 32
  learning_rate: 0.0003
  reconstruction_weight: 1.0
  prediction_weight: 1.0
  dataset_path: runs/alien/random_sequences.pt
alternating:
  interval: 1
  updates: 1
  batch_size: 32
  learning_rate: 0.0001
  pretrained_path: runs/alien/sdam_pretrain/sdam_autoencoder.pt
